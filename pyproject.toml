[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparq-triage"
version = "0.14.0"
description = "Spiking physics-in-the-loop autonomous reinforcement triage of single-photon emitters (SPARQ)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  {name = "Tanvir Mahmud Mahim", email = "tanvir.mahim@bracu.ac.bd"},
]
keywords = ["single-photon emitters", "g2", "HBT", "spiking neural networks", "reinforcement learning", "quantum optics", "digital twin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/TaN-MM-Org/sparq-triage"
Issues = "https://github.com/TaN-MM-Org/sparq-triage/issues"

[project.optional-dependencies]
ml = ["torch>=2.0"]
figures = ["matplotlib>=3.7"]
test = ["pytest", "torch>=2.0"]

[tool.setuptools]
packages = ["sparq"]
